name: Сайт клуба на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одна выкатка за раз; начатую не обрываем, чтобы не получить полусайт.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Прогнать тесты
        run: pytest

      - name: Выгрузить сайт
        # Свой домен задаётся переменной репозитория SITE_DOMAIN (Settings →
        # Secrets and variables → Actions → Variables) и тем же именем в
        # Settings → Pages → Custom domain. С ним сайт живёт в корне домена.
        #
        # Без домена сайт живёт в папке проекта: без префикса абсолютные
        # ссылки уехали бы на shvechkova.github.io/history. Имя владельца в
        # адресе — строчными, иначе канонический адрес разойдётся с тем, по
        # которому страницу открывают.
        #
        # SITE_URL нужен канону, карточкам пересылки и карте сайта.
        #
        # Коды подтверждения прав в Яндекс.Вебмастере и Google Search Console —
        # переменные репозитория с теми же именами. Не заданы — тегов нет.
        env:
          DOMAIN: ${{ vars.SITE_DOMAIN }}
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$DOMAIN" ]; then
            export SITE_BASE=""
            export SITE_URL="https://$DOMAIN"
          else
            export SITE_BASE="/$REPO"
            export SITE_URL="https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io"
          fi
          echo "Сайт будет жить на $SITE_URL$SITE_BASE"
          python -m app.web.export public

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
