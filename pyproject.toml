[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookclub-web"
version = "0.1.0"
description = "Сайт книжного клуба «Кабанья Читальня»"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.51",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    # База часовых поясов для zoneinfo: в Windows и в slim-образах своей может не быть.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=9", "httpx2>=2.9", "playwright>=1.49"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "error",
    # Предупреждение starlette о внутреннем использовании устаревшего алиаса anyio.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
