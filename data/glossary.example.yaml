# Образец словаря клуба. Формат — в data/README.md, раздел «Словарь».
# Лежит рядом с club.example.yaml и подхватывается вместе с ним.

terms:
  # Понятие со всем, что бывает: синонимы, статья, глава конспекта и связи.
  - id: conway-law
    name: Закон Конвея
    aliases: [Conway's law]
    summary: >
      Система повторяет структуру общения в организации, которая её делает:
      четыре команды на компиляторе дадут четырёхпроходный компилятор.
    article: https://example.org/notes/conway
    chapters:
      - book: archive-example
        chapter: 1
    related: [adr]

  # Минимальное понятие: только id, название и определение.
  - id: adr
    name: ADR
    aliases: [Architecture Decision Record]
    summary: >
      Короткая запись архитектурного решения: контекст, само решение и почему
      выбрали его, а не другое.
