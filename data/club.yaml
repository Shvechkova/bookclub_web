# Рабочие данные клуба. Формат — в data/README.md, образец — в club.example.yaml.
# Книги и встречи заполняются отдельно: пока их нет, разделы сайта показывают,
# чем они наполняются.

club:
  name: Кабанья Читальня
  descriptor: IT книжный клуб · Самара
  tagline: IT-книжный клуб в Самаре
  since: 2023
  # Перевод строки — место, где заголовок делится на строки.
  manifesto: |-
    Читаем техническую литературу
    и спорим о ней вслух
  about_title: Первый IT-книжный клуб Самары
  # Перевод строки делит рукописную строку на две.
  about_hand: |-
    читаем, спорим,
    тащим на свой опыт
  facts:
    - label: Только очно
      text: Трансляций и записей нет — всё происходит в комнате
    - label: Открытый
      text: Прийти может кто угодно
    - label: Новичкам
      text: Спрашивать «а что это значит?» можно и нужно
  rules:
    - label: Разбираем вслух
      text: Это не лекция и не доклад — главу обсуждаем вместе
    - label: Не прочитал — приходи
      text: Это сильно лучше, чем не прийти. Самое полезное — живое обсуждение
    - label: Неси свой опыт
      text: Примеряем главы на свои проекты. Самое интересное начинается с «а у нас было ровно наоборот»
  about:
    - >
      Читаем техническую литературу и спорим о ней вслух. Не пересказываем
      главы, а тащим их на свой опыт: самое интересное вылезает в «а у нас на
      работе было ровно наоборот».
    - >
      Собираемся только очно, в Самаре: трансляций и записей нет, всё
      происходит в комнате. Первый IT-книжный клуб в городе — собрались в 2023.
    - >
      Клуб открытый: прийти может кто угодно, звать никого не надо. Новеньким
      спрашивать «а что такое ограниченный контекст» можно и нужно.
  routine:
    - >
      Разбираем главы вслух. Это не лекция: главу берут по частям, и объясняют
      её разные люди, а не один.
    - >
      Не прочитал — приходи всё равно: это сильно лучше, чем не прийти. Читать
      глубже — личный выбор, а не норма для всех.
    - >
      Ведущий у каждой встречи свой, и это не эксперт. Его работа — держать
      время и следить, чтобы говорил не один человек.
  place:
    venue: хакспейс s4m.space
    building: Дом77
    street: Ленинградская 77
    floor: 4 этаж
    room: комната 413
    city: Самара
    map: https://2gis.ru/samara/firm/70000001104494028
  slot: среда, раз в две недели
  time: "19:30"
  duration_minutes: 90
  timezone: Europe/Samara
  terms:
    - Вход свободный, без регистраций
    - Не прочитал — всё равно приходи
  telegram: https://t.me/+tHeWWl4z97s2ZmIy
  space:
    name: s4m.space
    site: https://s4m.space/
    channel: https://t.me/s4m_space
    chat: https://t.me/+W5jzJeFMdNg4ODAy
    thread: https://t.me/c/2521642987/1540
  warmup:
    name: Тыжархитектор
    lead: "Карточный тренажёр по архитектуре: тянешь проблему системы — подбираешь решение"
    url: https://shvechkova.github.io/tyzharchitector/
  marquee:
    - книги · споры · айтишечка · всегда живые встречи · можно пиво, можно чай · не лекция, не доклад
    - не прочитал — всё равно приходи · вход свободный, без регистраций

