  - id: kleppmann-ddia-2
    number: 5
    title: Высоконагруженные приложения, 2-е издание
    short_title: Высоконагруженные приложения
    author: Мартин Клеппман, Крис Риккомини
    status: reading
    cover: covers/kleppmann-ddia-2.jpg
    chapters: []

meetings:
  - id: m-2026-09-23
    date: 2026-09-23
    book: brooks-mythical-man-month
    chapters:
      - { number: 1, outcome: closed }
      - { number: 2, outcome: closed }
      - { number: 3, outcome: closed }
      - { number: 4, outcome: closed }
      - { number: 5, outcome: closed }
      - { number: 6, outcome: closed }
      - { number: 7, outcome: closed }
    announce:
      - Кто видел, как на горящий проект кидали людей? Чем кончилось?
    # Итоги — из поста в канале («Текст из канала» в заметках клуба),
    # без эмодзи, обращений и имён участников.
    outcome:
      agreed: >
        Эффект второй системы реален. Во вторую систему тащат и «травмы» первой,
        и накопленные идеи с самоуверенностью: верно и то, и другое.
      argued: >
        Устарела ли книга. Одни считают, что всё в ней давно очевидно и процессы
        у всех есть. Другие возражают: мысли неочевидны, а настоящих процессов у
        большинства команд как раз нет.
      taken: >
        Тонущий проект спасёт только одно из двух: сдвинуть сроки или урезать
        функциональность. И это надо честно доносить до бизнеса.
      lead: >
        В среду разбирали первые семь глав Брукса и начали с главного спора:
        устарела ли книга вообще? Мнения разделились. Одни считают, что всё в ней
        давно очевидно и процессы у всех есть. Другие возражают: мысли
        неочевидны, а настоящих процессов у большинства команд как раз нет.
      by_chapter:
        - chapters: [1]
          heading: Смоляные ямы
          text: >
            Программа «для себя» и программный продукт по сложности несравнимы.
            Продукту нужны контракты, интерфейсы, документация и тесты.
        - chapters: [2]
          heading: Мифический человеко-месяц, он же закон Брукса
          text: >
            Новый человек в горящем проекте забирает время наставника на
            онбординг, поэтому рост команды не спасает сроки. Команду надо
            растить заранее. А тонущий проект спасёт только одно из двух:
            сдвинуть сроки или урезать функциональность. И это надо честно
            доносить до бизнеса.
        - heading: Планирование по Бруксу
          text: >
            Треть на планирование, шестая часть на код, по четверти на
            тестирование компонентов и системы. Большая часть работы,
            получается, вообще не написание кода.
        - chapters: [3]
          heading: Операционные бригады
          text: >
            Схема с ролями «как в хирургической бригаде» скорее устарела: в ИТ
            роли давно сложились. Перенести её можно разве что на очень
            маленькую автономную команду. Зато идея общаться через лидов команд
            перекликается с современной «командой на одну пиццу».
        - chapters: [5]
          heading: Эффект второй системы
          text: >
            Его признали реальным. Поспорили о причине. То ли во вторую систему
            тащат «травмы» и устаревшие знания из первой, то ли дело в
            накопленных идеях и самоуверенности. Сошлись, что верно и то, и
            другое.
        - chapters: [6, 7]
          text: >
            Решения фиксировать по единому стандарту, изменения сообщать всем,
            документацию держать единой и актуальной. Проекты гибнут от плохой
            коммуникации.
      debates:
        - heading: Комментарии в коде
          text: >
            Кто-то обходится понятными названиями и короткими функциями, кто-то
            считает, что без них никак, особенно если код сгенерировала
            нейросеть.
        - heading: Где хранить документацию
          text: >
            Вики + Jira против документации рядом с кодом (ADR, SDD), чтобы её
            сразу видела нейросеть. Прозвучала и радикальная идея: править
            документацию только через нейросеть, по аналогии с запретом ручных
            правок на серверах.
        - heading: Насколько новые технологии брать
          text: >
            Быть «на острие» или брать новое, но уже обкатанное. И где это
            вообще возможно? Стартапам не хватает ресурсов, крупным мешают
            согласования, остаются средние компании.
        - heading: Иллюзия насмотренности
          text: >
            Нейросети создают «иллюзию насмотренности» и пишут плохой код, если
            сам не знаешь, как должно быть.
      verdict: >
        Книга выглядит как «история программирования», но снова злободневна: ИИ
        ломает сложившиеся процессы, и их приходится выстраивать заново.
    topics:
      - Закон Брукса
      - Эффект второй системы
      - Команда на одну пиццу
      - ADR
      - SDD
    images:
      poster:
        src: meetings/m-2026-09-23-poster.jpg
        alt: >
          Афиша встречи №1, начинаем новую книгу: «Мифический человеко-месяц»,
          Фредерик Брукс, 1975. Среда, 23.09, 19:30. Цитата «Девять женщин не
          родят ребёнка за месяц» — та самая книга, из которой это растащили.
          Разбираем главы 1–7: Смоляная яма, Закон Брукса, Хирургическая
          бригада, Концептуальная целостность, Эффект второй системы, Донести
          слово, Вавилонская башня. Хакспейс s4m.space, Дом77, Ленинградская 77,
          4 этаж, комната 413.
      recap:
        src: meetings/m-2026-09-23-recap.jpg
        alt: >
          Карточка итогов: разобрали главы 1–7, 23.09. Книга выглядит как
          «история программирования», но снова злободневна: ИИ ломает
          сложившиеся процессы. Программа «для себя» и продукт несравнимы,
          новый человек в горящем проекте забирает время наставника, тонущий
          проект спасёт сдвиг сроков или урезание функций, эффект второй
          системы реален, проекты гибнут от плохой коммуникации. Спорили,
          устарела ли книга, нужны ли комментарии в коде, где хранить
          документацию и насколько новые технологии брать.

  - id: m-2026-10-07
    date: 2026-10-07
    host: Настя
    book: brooks-mythical-man-month
    chapters:
      - { number: 8, outcome: closed }
      - { number: 9, outcome: closed }
      - { number: 10, outcome: closed }
      - { number: 11, outcome: closed }
      - { number: 12, outcome: closed }
      - { number: 13, outcome: closed }
      - { number: 14, outcome: closed }
      - { number: 15, outcome: closed }
    announce:
      - «Расписание срывается по одному дню за раз» — как у нас срывается?
    outcome:
      agreed: Детали устарели, принципы узнаваемы до сих пор.
      argued: >
        Умерли ли блок-схемы. Одни: без схемы не передать алгоритм и не
        прочитать ТЗ. Другие: кто с диаграммами не знаком, тот от них впадает в
        ступор.
      taken: >
        На сам код уходит от силы половина времени задачи, так что оценивать
        надо задачу целиком.
      quote:
        text: Своего кода нет, есть общий продукт
      lead: >
        Вторая встреча по книге, главы 8–15. Ведущая провела по главам,
        остальные комментировали, спорили и подкидывали случаи из практики.
        Всплыли и госзаказчики, не знающие слова «баг», и стойки под Kubernetes
        в жилой квартире.
      by_chapter:
        - chapters: [8]
          heading: Оценка сроков
          text: >
            На сам код уходит от силы половина времени задачи. Остальное съедают
            согласования, совещания и срочные мелочи, так что оценивать надо
            задачу целиком. И чем дольше живёт проект, тем дороже в нём каждая
            новая задача.
        - chapters: [9]
          heading: Бюджеты
          text: >
            Деньги уходят не на одних разработчиков: инструментарий и машинное
            время тоже стоят. На современный лад это тестовые и предпродовые
            среды. Чем ближе к проду, тем дороже.
        - chapters: [10]
          heading: Документы проекта
          text: >
            Набор с тех пор почти не изменился: целевые критерии, спецификации,
            графики, бюджеты, оргсхема. Здесь же появляется закон Конвея.
        - chapters: [11]
          heading: Планируйте на выброс
          text: >
            Первая версия всегда плохая, её и планируют выбросить. Гладко было
            на бумаге: в основной главе Брукс описывает каскад, а в юбилейном
            послесловии сам признаёт, что нужна итеративная разработка.
            Сопровождение тянет чуть ли не 40 % стоимости, а после каждой правки
            нужен регресс.
        - chapters: [12]
          heading: Общие инструменты
          text: >
            Нужны «инструментальщики», чтобы команды не изобретали велосипед
            каждая по разу. Машины Брукс делит на целевую, отладочную и машину
            поддержки, а это ровно наши тестовые и продовые серверы.
        - chapters: [13]
          heading: Целое против частей
          text: >
            Написать программу легко, трудно заставить её работать как целое.
            Отсюда нисходящее проектирование, структурное программирование и
            контроль изменений.
        - chapters: [14]
          heading: Опоздания
          text: >
            Отставание набегает понемногу каждый день. Лечится вехами, отчётами
            и менеджерами, которые честно говорят начальству, что сроки поехали.
            Тут поспорили: надо ли начальнику всегда знать правду? Сошлись, что
            зависит от уровня и адекватности начальника.
        - chapters: [15]
          heading: Документация
          text: >
            Три уровня: чтобы пользоваться, чтобы доверять и чтобы
            модифицировать. Блок-схемы Брукс считает анахронизмом, а объяснение
            кода советует держать рядом с кодом.
      debates:
        - heading: Блок-схемы
          text: >
            Умерли или нет? Одни: без схемы не передать алгоритм и не прочитать
            ТЗ. Другие: кто с диаграммами не знаком, тот от них впадает в ступор.
            BPMN и UML, кстати, живы.
        - heading: Документация опенсорса лучше корпоративной?
          text: >
            Прозвучал контраргумент: это ошибка выжившего. Проект с плохой
            документацией просто не попадает в поисковик, вы его и не видели.
        - heading: Waterfall или Agile?
          text: >
            Agile в итоге прозвали «программированием по подписке».
      aside: >
        Заодно уходили в рынок труда (джуны дороже мидлов из-за менторства),
        fixed price vs time and material, работу нейронок по спецификациям и
        устройство S3.
      verdict: >
        Оценки разошлись сильно. Кто-то считает, что книга устарела, детали
        мешают и переиздавать её было незачем. Кто-то, что это классика, идеи
        которой стали нормой. Кто-то, что это полезный экскурс: можно заглянуть
        на 30 лет назад и посмотреть, как люди жили. Общий знаменатель: детали
        устарели, принципы узнаваемы до сих пор.
    topics:
      - Закон Конвея
      - Итеративная разработка
      - Нисходящее проектирование
      - Структурное программирование
      - Регрессионное тестирование
      - Ошибка выжившего
      - BPMN
      - UML
    images:
      poster:
        src: meetings/m-2026-10-07-poster.jpg
        alt: >
          Афиша встречи №2, продолжаем ту же книгу: «Мифический
          человеко-месяц», Фредерик Брукс, 1975. Среда, 07.10, 19:30. Цитата
          «Как проект опаздывает на год? По одному дню за раз». Вторая половина
          книги — про практику: оценки, сроки, инструменты, тесты. Разбираем
          главы 8–15: Попытки измерить, Непосильный груз, Документарная
          гипотеза, Планируй выбросить, Заточенные инструменты, Целое и части,
          И грянул гром, Другая сторона. Хакспейс s4m.space, Дом77,
          Ленинградская 77, 4 этаж, комната 413.
      recap:
        src: meetings/m-2026-10-07-recap.jpg
        alt: >
          Карточка итогов: разобрали главы 8–15, 07.10. Оценки, бюджеты,
          инструменты и сроки; детали устарели, принципы узнаваемы до сих пор.
          Глава 8 — на сам код уходит от силы половина времени задачи. Глава 11
          — первая версия всегда плохая, её и планируют выбросить; сопровождение
          тянет чуть ли не 40 % стоимости. Глава 14 — отставание набегает
          понемногу каждый день. Глава 15 — блок-схемы Брукс считает
          анахронизмом, BPMN и UML живы. Спорили: устарела ли книга, умерли ли
          блок-схемы, бывает ли «мой код», что считать регрессом. Цитата
          вечера: «Своего кода нет, есть общий продукт». Главы 8–15 закрыты,
          далее 21.10 — главы 16–19.

  - id: m-2026-10-21
    date: 2026-10-21
    book: brooks-mythical-man-month
    chapters:
      - { number: 16, outcome: closed }
      - { number: 17, outcome: closed }
      - { number: 18, outcome: closed }
      - { number: 19, outcome: closed }
    announce:
      - Нейронки — это серебряная пуля? Что бы Брукс написал в 2026?
    outcome:
      agreed: За 50 лет главные проблемы разработки никуда не делись.
      argued: >
        Опроверг ли ИИ Брукса. Одни считают, что он наконец-то стал неправ, но
        наполовину: ускорение кратное, а во что-то всё равно упираемся. Другие:
        проблема в людях.
      taken: MVP «на выброс» на практике никто не выбрасывает.
      quote:
        text: Гораздо лучше ошибаться и выражаться ясно, чем выражаться туманно
      lead: >
        Последняя встреча по Бруксу. Главы пересказывали по конспекту:
        «Серебряной пули нет», ответ критикам через девять лет и сверку тезисов
        1975 и 1995 годов. Остальные спорили почти два часа. Сошлись на
        неожиданно простом: за 50 лет главные проблемы разработки никуда не
        делись.
      by_chapter:
        - heading: Серебряной пули нет
          chapters: [16]
          text: >
            Брукс делит трудности на сущностные и акцидентальные. Сущность —
            проектирование и концепция, то есть что вообще строить. Акциденции —
            запись этого на конкретном языке под конкретное железо. Вывод: ни
            одна технология в одиночку не ускорит разработку на порядок.
        - heading: Что тогда работает
          chapters: [16, 17]
          text: >
            Покупать готовое, быстро прототипировать, выращивать программу от
            простой системы к сложной и растить сильных проектировщиков.
            Прочитали и почти хором сказали: Брукс изобретает agile.
        - heading: Экономика ПО
          text: >
            Понравилось наблюдение: как только компьютер подешевел, заказчики
            перестали платить за софт под заказ и захотели готовый.
        - heading: Планируйте на выброс
          text: >
            На практике MVP никто не выбрасывает. «Нет ничего более постоянного,
            чем временное».
        - heading: Форма книги
          chapters: [18, 19]
          text: >
            Ругали дружно. Первые 18 глав — исходный текст, а где автор ошибся,
            узнаёшь только в 19-й. Прозвучало: «поток сознания». Заодно признали,
            что краткие пересказы Брукса выходят очень плохими (этот не
            исключение).
      debates:
        - heading: Опроверг ли ИИ Брукса?
          text: >
            Одни: «Он наконец-то стал неправ через 50 лет». Но наполовину:
            ускорение кратное, а во что-то всё равно упираемся. Другие: проблема
            в людях, и даже Альтман признаёт, что ИИ используют не так, как
            ожидали.
        - heading: Будет ли ИИ писать сразу машинный код?
          text: >
            Одни: бред, проверки и компилятор нужны всё равно. Другие видят
            иной путь: код сведётся к формальной проверке, как доказательства в
            математике.
        - heading: Качество или agile?
          text: >
            Прозвучало противоречие между призывом к качеству и инкрементальной
            разработкой. Возразили: итерации как раз и помогают чинить
            архитектуру постепенно.
        - heading: Переиспользование кода
          text: >
            Одни: «была эпоха переиспользования, сейчас эпоха низкой
            связанности», то есть Go без наследования и микросервисы. Другие: не
            совсем, есть монорепозитории, адаптеры, перегрузка. Третьи: подложить
            свою реализацию интерфейса в библиотеку легко, а с чужим
            микросервисом приходится договариваться. Ответ по DDD: пиши свой
            адаптер.
      aside: >
        Заодно уносило в бланки МВД, костыли JavaScript ради обратной
        совместимости, Rust («не вершина языков»), шейдеры и DOOM, который так и
        не портировали на SEGA.
      verdict: >
        Брукса дочитали. Хвалили за то, что его проблемы узнаёшь и сегодня,
        ругали за структуру и ворох устаревших деталей. Хорошая проработка задач
        так и осталась «дорогой зоной комфорта»: начальство не хочет думать,
        разработчики ленятся. Прозвучало предложение написать такую же книгу про
        наше время, 50 лет спустя.
    topics:
      - Серебряной пули нет
      - Сущность и акциденция
      - Быстрое прототипирование
      - Итеративная разработка
      - Планируйте на выброс
      - Связанность
      - Монорепозиторий
      - Предохранительный слой
      - Предметно-ориентированное проектирование
    images:
      recap:
        src: meetings/m-2026-10-21-recap.jpg
        alt: >
          Карточка итогов 21.10: Брукса дочитали. Зачёркнуты главы 16–19 и
          эпилог, штамп «прочитано 19 из 19». Спорили до последнего: опроверг
          ли ИИ Брукса, качество или agile, переиспользование или низкая
          связанность, первые или лучшие. Три встречи: 23.09 — главы 1–7,
          07.10 — главы 8–15, 21.10 — главы 16–19. Итог трёх встреч: за 50 лет
          проблемы никуда не делись; детали устарели, задачи всё так же плохо
          прорабатывают.
      poster:
        src: meetings/m-2026-10-21-poster.jpg
        alt: >
          Афиша встречи №3, дочитываем ту же книгу, финал: «Мифический
          человеко-месяц», Фредерик Брукс, 1975. Среда, 21.10, 19:30. Цитата
          «Серебряной пули нет». Финал книги: Брукс через двадцать лет проверяет
          сам себя — что сбылось, где ошибся и почему серебряной пули нет.
          Разбираем главы 16–19 и эпилог: Серебряной пули нет, Повторный выстрел
          «Серебряной пули нет», Тезисы мифического человеко-месяца — false или
          true?, Мифический человеко-месяц двадцать лет спустя, Пятьдесят лет
          удивления, воодушевления и радости. Хакспейс s4m.space, Дом77,
          Ленинградская 77, 4 этаж, комната 413.

