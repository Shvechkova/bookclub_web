# Образец файла данных клуба. Показывает все возможности формата.
# Содержимое выдуманное: рабочие данные лежат в club.yaml.
# Описание полей — в data/README.md.

club:
  name: Кабанья Читальня
  descriptor: IT книжный клуб
  tagline: IT-книжный клуб в Самаре
  since: 2023
  # Перевод строки — место, где заголовок делится на строки.
  manifesto: |-
    Читаем техническую литературу
    и спорим о ней вслух
  about_title: Первый IT-книжный клуб Самары
  # Перевод строки делит рукописную строку на две.
  about_hand: |-
    читаем, спорим,
    тащим на свой опыт
  facts:
    - label: Только очно
      text: Трансляций и записей нет — всё происходит в комнате
    - label: Открытый
      text: Прийти может кто угодно
    - label: Новичкам
      text: Спрашивать «а что это значит?» можно и нужно
  rules:
    - label: Разбираем вслух
      text: Это не лекция и не доклад — главу обсуждаем вместе
    - label: Не прочитал — приходи
      text: Это сильно лучше, чем не прийти. Самое полезное — живое обсуждение
    - label: Неси свой опыт
      text: Примеряем главы на свои проекты. Самое интересное начинается с «а у нас было ровно наоборот»
  about:
    - Читаем техническую литературу и спорим о ней вслух.
    - "Собираемся только очно: трансляций и записей нет."
    - "Клуб открытый: прийти может кто угодно."
  routine:
    - "Разбираем главы вслух. Это не лекция: главу берут по частям."
    - Не прочитал — приходи всё равно.
    - "Ведущий у каждой встречи свой, и это не эксперт: он держит время."
  place:
    venue: площадка клуба
    building: Дом77
    street: Ленинградская 77
    floor: 4 этаж
    room: комната 413
    city: Самара
    map: https://2gis.ru/samara/firm/70000001104494028
  slot: среда, раз в две недели
  time: "19:30"
  duration_minutes: 90
  timezone: Europe/Samara
  terms:
    - Вход свободный, без регистраций
    - Не прочитал — всё равно приходи
  telegram: https://t.me/example
  space:
    name: example.space
    site: https://example.space/
    channel: https://t.me/example_channel
    chat: https://t.me/+examplechat
    thread: https://t.me/c/1234567890/1
  warmup:
    name: Тыжархитектор
    lead: "Карточный тренажёр по архитектуре: тянешь проблему системы — подбираешь решение"
    url: https://shvechkova.github.io/tyzharchitector/
  marquee:
    - КНИЖНАЯ СРЕДА
    - КОД · КНИГИ · СПОРЫ · КОФЕ · ГЛАВЫ

books:
  # Книга без записанных встреч: прочитана до того, как клуб начал вести хронику.
  - id: archive-example
    number: 1
    title: Книга из архива
    author: Автор Архивный
    status: closed
    period: весна 2025
    notes_url: https://example.org/notes/archive
    close_note: Прочитали до того, как начали записывать встречи.
    chapters:
      - title: Первая глава
        notes_url: https://example.org/notes/archive/1
      - title: Вторая глава

  # Книга, прочитанная целиком и по порядку.
  - id: closed-example
    number: 2
    title: Закрытая книга
    author: Автор Закрытый
    status: closed
    close_note: Дочитали до конца, спорили больше всего про третью главу.
    takeaways:
      - Первый вывод клуба.
      - Второй вывод клуба.
    chapters:
      - title: Начало
      - title: Середина
      - title: Конец

  # Книга, которую читают сейчас, и не целиком: взяты только главы 1, 3 и 5.
  - id: reading-example
    number: 3
    title: Читаемая книга
    short_title: Читаемая
    author: Автор Читаемый
    status: reading
    taken_chapters: [1, 3, 5]
    notes_url: https://example.org/notes/reading
    chapters:
      - title: Глава первая
      - title: Глава вторая
      - title: Глава третья
      - title: Глава четвёртая
      - title: Глава пятая

  - id: dropped-example
    number: 4
    title: Брошенная книга
    author: Автор Брошенный
    status: dropped
    close_note: "Бросили на второй главе: язык оказался неподъёмным."
    chapters:
      - title: Одна
      - title: Две
      - title: Три

  - id: queued-example
    number: 5
    title: Книга в списке
    author: Автор Будущий
    status: queued
    chapters:
      - title: Пока не читали

meetings:
  # Обычная встреча: книга плюс формат во втором часу.
  - id: m-2026-06-03
    date: 2026-06-03
    host: Настя
    book: closed-example
    chapters:
      - { number: 1, outcome: closed }
      - { number: 2, outcome: closed }
    format:
      name: Лайтнинги
      note: пять минут на человека, без слайдов
    announce:
      - Как устроено начало книги
      - Зачем автор начал именно с этого
    # Три тезиса и цитата — выжимка для раздела «Сейчас». Всё ниже quote —
    # полная форма итогов, как пост в канале. Любую часть можно не писать.
    outcome:
      agreed: С тем, что первая глава лишняя, согласились все.
      argued: Дольше всего спорили про вторую.
      taken: Забираем приём с разделением ответственности.
      quote:
        text: Архитектор — градостроитель, а не строитель.
        chapter: 2
      lead: Разобрали две главы, и вторая съела почти всё время.
      by_chapter:
        - chapters: [1]
          heading: Зачем это начало
          text: Одни считают первую главу разминкой, другие — лишней.
        - heading: Бюджеты
          text: Пункт без глав, так тоже можно.
        - chapters: [1, 2]
          text: Пункт без заголовка, только с главами.
      debates:
        - heading: Нужна ли вторая глава
          text: Сошлись на том, что нужна, но вдвое короче.
      aside: Заодно уходили в код-ревью и дежурства.
      verdict: "Книга старше половины клуба, а проблемы в ней те же: это и пугает."
    topics:
      - Закон Конвея
    links:
      - { title: Разбор в блоге автора, url: https://example.org/post }
    # Афиша и карточка итогов: пути внутри app/web/static, подпись обязательна.
    # До встречи на странице стоит афиша, после — карточка итогов.
    images:
      poster:
        src: meetings/m-2026-10-07-poster.jpg
        alt: "Афиша встречи: «Мифический человеко-месяц», главы 8–15, среда, 19:30"
      recap:
        src: meetings/m-2026-10-07-recap.jpg
        alt: "Карточка итогов: оценки врут, документация нужна, серебряной пули нет"

  # Главу не дожали: третью перенесли на следующую встречу.
  - id: m-2026-06-17
    date: 2026-06-17
    host: Артём
    book: closed-example
    chapters:
      - { number: 3, outcome: carried }

  - id: m-2026-07-01
    date: 2026-07-01
    host: Лена
    book: closed-example
    chapters:
      - { number: 3, outcome: closed }
    outcome:
      agreed: Дожали третью главу и на этом книгу закрыли.
      argued: Спорили, стоило ли вообще её дочитывать.
      taken: Забираем правило не ускоряться на хвостах.

  # Встреча без книжной части: день открытых дверей.
  - id: m-2026-07-15
    date: 2026-07-15
    host: Игорь
    title: "ADR-дуэль: выбираем хранилище"
    format:
      name: ADR-дуэль
      note: две команды защищают противоположные решения
    topics:
      - Закон Конвея

  # Служебная встреча: ни книги, ни формата.
  - id: m-2026-07-29
    date: 2026-07-29
    title: Голосование за следующую книгу

  # Выборочное чтение: взяты главы 1, 3 и 5, разбираем их не подряд.
  - id: m-2026-08-12
    date: 2026-08-12
    host: Настя
    book: reading-example
    chapters:
      - { number: 1, outcome: closed }
      - { number: 3, outcome: closed }
    format:
      name: Петпроект-практика
